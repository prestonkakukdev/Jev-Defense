[project]
name = "jev-defense"
version = "0.2.1"
description = "A Jev-powered security guard for AI agents: blocks dangerous tool calls, strips prompt injection, and scans skills. Works with Claude Code, Codex, Copilot CLI, Gemini CLI, Cursor, and OpenCode."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["typesafe-sdk>=0.6.0"]
keywords = ["ai-agents", "prompt-injection", "llm-security", "claude-code", "guardrails", "jev", "typesafe"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# `pip install` puts a `jevdefense` command on your PATH.
[project.scripts]
jevdefense = "jev_defense.__main__:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jev_defense"]

[tool.setuptools.package-data]
jev_defense = ["plugins/*.js"]
