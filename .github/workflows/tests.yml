name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # Offline: TYPESAFE_API_KEY is deliberately empty, so the suite uses the mock and costs nothing.
      - run: pytest -q
        env:
          TYPESAFE_API_KEY: ""
